services:
  api:
    environment:
      APP_CONFIG: /app/config/api.stage.supabase.yaml
      RUST_LOG: info

  indexer:
    environment:
      APP_CONFIG: /app/config/indexer.stage.supabase.yaml
      RUST_LOG: info

  market-manager:
    build:
      context: .
      dockerfile: services/market-manager/Dockerfile
    environment:
      APP_CONFIG: /app/config/market-manager.stage.yaml
      RUST_LOG: info
      LOG_DIR: /app/logs
    volumes:
      # Mount config dir read-only so YAML / events / secrets edits take
      # effect on container restart without rebuilding the image.
      - ./services/market-manager/config:/app/config:ro
      - market-manager-state:/state
      - ./logs/market-manager:/app/logs
    restart: unless-stopped

volumes:
  market-manager-state:
