[package]
name = "dodex-e2e-harness"
version = "0.1.0"
edition = "2021"

[dependencies]
fd-lock = "4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "ledger-bootstrap"
path = "src/bin/ledger_bootstrap.rs"
