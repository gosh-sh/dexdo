[package]
name = "dodex-sdk"
version.workspace = true
edition.workspace = true

# Own workspace root, deliberately excluded from the repo-root workspace
# (see root `Cargo.toml` `exclude`). The halo2 proof pipeline pulls a heavy,
# distinct zk/halo2 dependency graph; keeping it in its own workspace leaves
# the root `cargo --workspace` resolve light. All git sources are public over
# HTTPS — no SSH key required.
[workspace]
members = [".", "e2e-harness"]
default-members = [".", "e2e-harness"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
hex = "0.4.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "mint_pn_pool"
path = "src/bin/mint_pn_pool.rs"
required-features = ["default"]

[[bin]]
name = "deploy_oracle"
path = "src/bin/deploy_oracle.rs"
required-features = ["default"]

[[bin]]
name = "onboard_user_shellnet"
path = "src/bin/onboard_user_shellnet.rs"
required-features = ["default"]

[[bin]]
name = "dexdo"
path = "src/bin/dexdo.rs"
required-features = ["default"]

[features]
default = ["ackinacki-kit/default", "ackinacki-kit/contracts"]
wasm = [
    "dep:wasm-bindgen",
    "dep:serde-wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:console_error_panic_hook",
    "dep:js-sys",
    "dep:gloo-timers",
    "ackinacki-kit/wasm",
    "ackinacki-kit/contracts",
]
single-wasm = ["wasm"]

[dependencies]
ackinacki-kit = { git = "https://github.com/gosh-sh/ackinacki-kit.git", tag = "v4.0.1", default-features = false }
dodex-contracts = { path = "../crates/contracts" }
base64 = "0.22.1"
hex = { workspace = true }
num-bigint = "0.4"
num-traits = "0.2.19"
parking_lot = "0.12"
pbkdf2 = { version = "0.12.2", features = ["simple"] }
reqwest = { version = "0.12", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
tokio = { version = "1", default-features = false, features = ["rt", "time"] }
tracing = "0.1"
url = "2"

# Layered halo2 voucher pipeline (witness export -> prover -> public-input
# decode). See src/services/halo2.
halo2-proover = { git = "https://github.com/gosh-sh/dexdo-halo2-kit", tag = "v0.2.0" }
dark_dex_halo2_private_witness_export_lib = { git = "https://github.com/gosh-sh/dexdo-halo2-kit", tag = "v0.2.0" }
gosh-dark-dex-halo2-new-circuit = { git = "https://github.com/gosh-sh/dexdo-halo2-kit", tag = "v0.2.0", package = "dex-halo2-circuit" }
# Branch must match the kit's own halo2-base pin (halo2-proover Cargo.toml) so
# Cargo unifies to a single crate — `sk_commit`'s `Fr` has to be the same field
# type the prover's circuit was built against.
halo2-base = { git = "https://github.com/gosh-sh/halo2-lib-zkevm-sha256-and-bls12-381", branch = "bump-halo2-lib-v0.4.1", default-features = false, features = ["halo2-axiom", "test-utils"] }

console_error_panic_hook = { optional = true, version = "0.1.7" }
gloo-timers = { optional = true, version = "0.3.0", features = ["futures"] }
js-sys = { optional = true, version = "0.3.83" }
serde-wasm-bindgen = { optional = true, version = "0.6.5" }
wasm-bindgen = { optional = true, version = "0.2.106", features = ["serde-serialize"] }
wasm-bindgen-futures = { optional = true, version = "0.4.56" }

[dev-dependencies]
ackinacki-kit = { git = "https://github.com/gosh-sh/ackinacki-kit.git", tag = "v4.0.1", features = ["default", "contracts"] }
anyhow = "1"
dodex-e2e-harness = { path = "e2e-harness" }
dodex-infrastructure = { path = "../crates/infrastructure" }
hex = "0.4.3"
num-bigint = "0.4"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1.49.0", features = ["rt", "macros", "time"] }

# `tvm_vm` (reached through ackinacki-kit -> tvm_client) drags in the
# axiom-crypto zk stack (axiom-eth -> halo2-lib -> snark-verifier), which
# upstream only builds on nightly. The gosh-sh forks below strip those gates.
#
# tvm-sdk carries an identical [patch] block in its own workspace root, but cargo
# only honours [patch] from the root manifest of the crate being built — it is
# never inherited through a dependency edge. This sdk workspace is a root of its
# own (the repo root excludes it), so the block has to be repeated here verbatim
# or the axiom stack resolves unpatched and `EthCircuitImpl` stops implementing
# halo2's `Circuit`. Keep in sync with the repo root and the tvm-sdk tag.
[patch.crates-io]
halo2-base = { git = "https://github.com/gosh-sh/halo2-lib-zkevm-sha256-and-bls12-381", branch = "bump-halo2-lib-v0.4.1" }
halo2-axiom = { git = "https://github.com/gosh-sh/halo2-axiom", branch = "main" }

# axiom-eth + snark-verifier-sdk pull halo2-base / halo2-ecc / zkevm-hashes from here.
[patch."https://github.com/axiom-crypto/halo2-lib.git"]
halo2-base = { git = "https://github.com/gosh-sh/halo2-lib-zkevm-sha256-and-bls12-381", branch = "bump-halo2-lib-v0.4.1" }
halo2-ecc = { git = "https://github.com/gosh-sh/halo2-lib-zkevm-sha256-and-bls12-381", branch = "bump-halo2-lib-v0.4.1" }
zkevm-hashes = { git = "https://github.com/gosh-sh/halo2-lib-zkevm-sha256-and-bls12-381", branch = "bump-halo2-lib-v0.4.1" }

# The gosh-sh axiom-eth branch also redirects snark-verifier{-sdk} to the
# stable-Rust gosh fork, so those need no [patch] entry of their own.
[patch."https://github.com/axiom-crypto/axiom-eth"]
axiom-eth = { git = "https://github.com/gosh-sh/axiom-eth", branch = "gosh-stable-rlcmanager-assignment" }
