# nextest profile config. Loaded automatically from `.config/nextest.toml`
# on every `cargo nextest run`.

# Tests in `crates/infrastructure/tests/reprojection.rs` serialize through
# a process-local `static REPROJECTION_LOCK: Mutex<()>` (see the file
# header). `cargo test` runs them in the same process so the lock works;
# nextest spawns one process per test, so the lock is invisible cross-
# process and shared `raw_events` / `oracles` / `live_orders` fixture
# rows collide. Pin the whole binary to one test at a time — restores
# the same serialization the in-process mutex was designed to give.
[[profile.default.overrides]]
filter = 'binary(reprojection)'
test-group = 'serial-reprojection'

# `inference_orders_repo` and `inference_orders_http` both read the singleton
# `indexer_cursors` row for CAPTURE_STREAM, and one of them flips `at_head` to false to
# exercise the read gate's capture-lag arm. Under nextest's per-process parallelism a
# sibling binary would observe that flip and receive -1500 for a lookup it expects to
# succeed. Both binaries are pinned to one one-thread group so they run sequentially and
# never race the cursor row; the in-process mutexes then cover the rest.
#
# `inference_market_metrics` used to join this group too: its state-count tests asserted
# whole-table aggregate DELTAS, which any concurrent writer to `inference_markets`
# corrupts. Those assertions are now scoped to each test's own seeded
# `orderbook_address`es (`inference_market_state_counts_for` /
# `inference_order_status_counts_for`), so the test no longer needs exclusive access to
# the table and runs fully parallel.
[[profile.default.overrides]]
filter = 'binary(inference_orders_repo) | binary(inference_orders_http)'
test-group = 'serial-capture-cursor'

# `inference_reconciler`'s at-head gate tests read a single shared `indexer_cursors`
# row (`test_inference_at_head_stream`) and flip its `at_head` flag. They serialize
# through a process-local `static AT_HEAD_GATE_LOCK`, which `cargo test` honors (one
# process) but nextest cannot (one process per test), so the flips race cross-process.
# Pin the whole binary to one test at a time — the same serialization the in-process
# mutex was designed to give. (The Queue B refresh-selection tests need no such help:
# they scope the SELECT to their own seeded addresses via `select_refresh_candidates_within`.)
[[profile.default.overrides]]
filter = 'binary(inference_reconciler)'
test-group = 'serial-inference-reconciler'

[test-groups]
serial-reprojection = { max-threads = 1 }
serial-capture-cursor = { max-threads = 1 }
serial-inference-reconciler = { max-threads = 1 }
serial-e2e-shared = { max-threads = 1 }

# Profile for the Woodpecker e2e run (.woodpecker/e2e.yml) against a live
# ephemeral network. The chain client has no per-call timeout, so if the network
# stalls a test blocks forever and nextest only prints `SLOW …` indefinitely.
# Terminate a test after ~10 min (60s × 10) so the pipeline fails cleanly instead
# of hanging for hours. Inherits the default profile's overrides + test-groups.
[profile.ci-e2e]
slow-timeout = { period = "60s", terminate-after = 10 }

# Most of this suite is bounded by on-chain windows it sleeps through, not by
# anything it competes for: every test picks its own note out of the pool and
# builds its own market, so run in parallel they mostly wait side by side
# instead of one after another. The exceptions are collected here and pinned to
# one at a time:
#
#   * `e2e_inference`, `e2e_inference_clob` and `e2e_register_account` all take
#     the SAME note. A note serialises its own operations through `_busy` and
#     rejects a repeated message body outright, so two of these at once would
#     have one of them silently dropped;
#   * the trader-path binaries read and write the shared test database.
#
# Everything outside this group holds a note nobody else does and never touches
# the database, so it needs no help. Note that the group only constrains this
# suite — it is the reason `--test-threads` above 1 is safe here at all.
[[profile.ci-e2e.overrides]]
filter = '''
    binary(e2e_inference) | binary(e2e_inference_clob) | binary(e2e_register_account)
  | binary(e2e_batch_orders) | binary(e2e_buy_full_set) | binary(e2e_cancel_batch_orders)
  | binary(e2e_cancel_order) | binary(e2e_order)
'''
test-group = 'serial-e2e-shared'

# One exception to the cap above, and it is not a hang: `e2e_inference_twosided`
# streams a deal past its probe tick, and the window every advance after the
# probe waits is the contract's own `_settleWindow` = clamp(P*600/1e9, 180,
# 3600). The book prices in whole SHELL (`PRICE_STEP`), so the cheapest possible
# deal still waits 600s for its second tick — 180s for the probe plus 600s for
# the one after it, before anything this test asserts can be true. No reading of
# the contract makes that shorter; the only way under 600s is to not stream at
# all, which is the coverage the test exists for.
#
# 25 minutes rather than 10, so a genuinely stuck run still fails the pipeline
# instead of hanging it.
[[profile.ci-e2e.overrides]]
filter = 'binary(e2e_inference_twosided)'
slow-timeout = { period = "60s", terminate-after = 25 }

# `e2e_inference_range` waits two on-chain clocks in sequence, and neither is
# negotiable. First a deal has to reach a CLOSE before the book has a reference
# price at all — a match publishes nothing, by design — which costs the 180s
# probe window. Then the range event needs a deadline far enough out that the
# list still sees `MIN_RESULT_GAP` of lead when the market is deployed against
# it, which is another ~240s. Neither clock can overlap the other: the deadline
# is only meaningful once the price it resolves from exists.
[[profile.ci-e2e.overrides]]
filter = 'binary(e2e_inference_range)'
slow-timeout = { period = "60s", terminate-after = 20 }

# `e2e_inference_recovery` outwaits the two clocks a buyer has to survive before
# either escape hatch opens: `MATCH_OPEN_TIMEOUT` (600s from the match, for a
# deal the seller never opened) and the deal's own reclaim window (its
# `settleWindow` plus grace, 900s from the open at the cheapest tick the book
# will price). The two run concurrently — one sleep covers both — so the floor
# is the longer of them plus the setup that has to precede it.
#
# 30 minutes rather than 25: the sleep is measured to an absolute deadline read
# off the chain, so a slow stand pushes the setup AND the deadline out together
# and the whole run stretches. The cap is there to catch a hang, and a hang
# still hits it.
[[profile.ci-e2e.overrides]]
filter = 'binary(e2e_inference_recovery)'
slow-timeout = { period = "60s", terminate-after = 30 }

# The sdk-e2e profile (used by the sdk workspace's proof/acceptance suites)
# lives in sdk/.config/nextest.toml, not here: sdk/ is a separate Cargo
# workspace with its own root, and nextest auto-discovers config relative to
# the workspace being run, not the invoking directory. Loading this file's
# `[[profile.default.overrides]]` against the sdk workspace is a hard error —
# they name binaries (`reprojection`, `inference_orders_repo`, etc.) that only
# exist in this (root) workspace.
