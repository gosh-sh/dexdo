# nextest profile config. Loaded automatically from `.config/nextest.toml`
# on every `cargo nextest run`.

# Tests in `crates/infrastructure/tests/reprojection.rs` serialize through
# a process-local `static REPROJECTION_LOCK: Mutex<()>` (see the file
# header). `cargo test` runs them in the same process so the lock works;
# nextest spawns one process per test, so the lock is invisible cross-
# process and shared `raw_events` / `oracles` / `live_orders` fixture
# rows collide. Pin the whole binary to one test at a time — restores
# the same serialization the in-process mutex was designed to give.
[[profile.default.overrides]]
filter = 'binary(reprojection)'
test-group = 'serial-reprojection'

# `inference_market_metrics` asserts whole-table aggregate DELTAS
# (`inference_market_state_counts` before/after inserting rows). Those deltas
# are corrupted when a sibling test in the same binary mutates
# `inference_markets` between the two reads — under nextest's default
# per-process parallelism the three tests race and `state_counts_and_staleness…`
# fails. Pin the binary to one test at a time, matching `reprojection` above.
[[profile.default.overrides]]
filter = 'binary(inference_market_metrics)'
test-group = 'serial-inference-metrics'


# `inference_orders_repo` and (once it exists) `inference_orders_http` both read the
# singleton `indexer_cursors` row for CAPTURE_STREAM, and one of them flips `at_head` to
# false to exercise the read gate's capture-lag arm. Under nextest's per-process
# parallelism a sibling binary would observe that flip and receive -1500 for a lookup it
# expects to succeed. One group, one thread: the in-process mutexes then cover the rest.
#
# `inference_orders_http` is not listed yet: nextest's `binary()` filter is validated at
# config-parse time against the binaries that currently exist in the workspace, and a
# filter naming a not-yet-existing binary fails the whole config with "operator didn't
# match any binary names" (nextest-filtering 0.21.1, cargo-nextest 0.9.137) — this holds
# for every matcher form (exact, contains, glob, regex), so there is no syntax that
# pre-declares a future binary. When the HTTP test file is added, extend the filter to
# `binary(inference_orders_repo) | binary(inference_orders_http)`.
[[profile.default.overrides]]
filter = 'binary(inference_orders_repo)'
test-group = 'serial-capture-cursor'

[test-groups]
serial-reprojection = { max-threads = 1 }
serial-inference-metrics = { max-threads = 1 }
serial-capture-cursor = { max-threads = 1 }
