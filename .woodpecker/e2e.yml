        ACKI_DIR='$ACKI_DIR'
        bash -s" < $CI_WORKSPACE/tests/e2e/sdk-proof-on-host.sh

  # Lane 2's tail. ~250s: it never freezes its market, so it pays for the
  # market coming up and for five operations on one note, and nothing else.
  sdk_key_rotation:
    when:
      - status: [success, failure]
    depends_on:
      - sdk_bounce_deploy
    image: *ansible_image
    environment:
      E2E_HOST: { from_secret: e2e_host }
      E2E_CI_USER: { from_secret: e2e_ci_user }
      ACKI_DIR: *acki_dir_on_host
    commands:
      - cp -ar $CI_WORKSPACE/.ssh ~/.ssh && chmod 700 ~/.ssh && chmod 600 ~/.ssh/id_ed25519
      - >
        ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
        -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes
        "$E2E_CI_USER@$E2E_HOST"
        "DEXDO_SHA='$CI_COMMIT_SHA'
        E2E_RUN_ID='$CI_PIPELINE_NUMBER'
        PIPELINE_ID='$CI_PIPELINE_NUMBER'
        SUITE=rotation
        ACKI_DIR='$ACKI_DIR'
        bash -s" < $CI_WORKSPACE/tests/e2e/sdk-proof-on-host.sh

  assert_deploy_dexdo:
    when:
      - status: [success, failure]
    depends_on:
      # The two newest lane tails are named here where the older ones are not,
      # and deliberately: the api-e2e step below now runs four tests at a time,
      # so anything still writing to the chain while it runs is another pair of
      # external messages racing the same root singletons. Waiting for these
      # costs a few minutes of overlap and buys back a class of failure that
      # took three pipelines to identify the first time.
      - sdk_losing_claim
      - sdk_key_rotation
      - sdk_bounce_deploy
      - sdk_book_segments
      - sdk_mm_cycle
      - sdk_coupon_debt
      - sdk_forfeit_close
      - sdk_oracle_quorum
      - sdk_multi_market
      - sdk_usdc_market
      - sdk_order_refusals
      - sdk_market_clock
      - sdk_exit_gates
      - sdk_oracle_admin
      - sdk_impostor_calls
      - sdk_replay
      - sdk_event_rejects
    image: *ansible_image
    environment:
      E2E_HOST: { from_secret: e2e_host }
      E2E_CI_USER: { from_secret: e2e_ci_user }
    commands:
      - cp -ar $CI_WORKSPACE/.ssh ~/.ssh && chmod 700 ~/.ssh && chmod 600 ~/.ssh/id_ed25519
      - >
        ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
        "$E2E_CI_USER@$E2E_HOST"
        "bash -s -- assert $CI_PIPELINE_NUMBER" < $CI_WORKSPACE/tests/e2e/host-lease.sh

  deploy_dexdo:
    when:
      - status: [success, failure]
    depends_on:
      - assert_deploy_dexdo
    image: *ansible_image
    directory: deploy/ansible
    environment:
      INV: *e2e_inventory
      SEED_NOTES_WS: *seed_notes_ws
    commands:
      - cp -ar $CI_WORKSPACE/.ssh ~/.ssh
      - >
        ansible-playbook deploy-dexdo.yml
        -i "$CI_WORKSPACE/$INV"
        -e dexdo_image_tag=$CI_COMMIT_SHA
        -e dexdo_seed_accounts=true
        -e dexdo_seed_notes_src="$CI_WORKSPACE/$SEED_NOTES_WS"

  assert_e2e_tests:
    when:
      - status: [success, failure]
    depends_on:
      - deploy_dexdo
    image: *ansible_image
    environment:
      E2E_HOST: { from_secret: e2e_host }
      E2E_CI_USER: { from_secret: e2e_ci_user }
    commands:
      - cp -ar $CI_WORKSPACE/.ssh ~/.ssh && chmod 700 ~/.ssh && chmod 600 ~/.ssh/id_ed25519
      - >
        ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
        "$E2E_CI_USER@$E2E_HOST"
        "bash -s -- assert $CI_PIPELINE_NUMBER" < $CI_WORKSPACE/tests/e2e/host-lease.sh

  e2e_tests:
    when:
      - status: [success, failure]
    depends_on:
      - assert_e2e_tests
    image: *ansible_image
    environment:
      E2E_HOST: { from_secret: e2e_host }
      E2E_CI_USER: { from_secret: e2e_ci_user }
      TEST_DATABASE_URL: { from_secret: e2e_test_database_url }   # postgres://dodex:<pw>@127.0.0.1:55432/dodex_test
      ACKI_DIR: *acki_dir_on_host
    commands:
      - cp -ar $CI_WORKSPACE/.ssh ~/.ssh && chmod 700 ~/.ssh && chmod 600 ~/.ssh/id_ed25519
      - >
        ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
        -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes
        "$E2E_CI_USER@$E2E_HOST"
        "DEXDO_SHA='$CI_COMMIT_SHA'
        E2E_NETWORK_ENDPOINT='http://127.0.0.1'
        E2E_SEED_NOTES='$ACKI_DIR/config/dex_test_notes.keys.json'
        TEST_DATABASE_URL='$TEST_DATABASE_URL'
        bash -s" < .acki-nacki/tests/dexdo/e2e-on-host.sh

  dump_logs:
    depends_on:
      - e2e_tests
      - sdk_proof
      - sdk_parallel_acceptance
      - sdk_usdc_release
      - sdk_resting_orders
      - sdk_market_orders
      - sdk_matching_ladder
      - sdk_shutdown_orders
      - sdk_price_above_par
      - sdk_bounce_recovery
      - sdk_losing_claim
      - sdk_key_rotation
      - sdk_cancelled_event
      - sdk_bounce_deploy
      - sdk_book_segments
      - sdk_mm_cycle
      - sdk_coupon_debt
      - sdk_forfeit_close
      - sdk_oracle_quorum
      - sdk_multi_market
      - sdk_usdc_market
      - sdk_order_refusals
      - sdk_market_clock
      - sdk_exit_gates
      - sdk_oracle_admin
      - sdk_impostor_calls
      - sdk_replay
      - sdk_event_rejects
    image: *ansible_image
    when:
      - status: [ failure ]
    environment:
      E2E_HOST: { from_secret: e2e_host }
      E2E_CI_USER: { from_secret: e2e_ci_user }
      ACKI_DIR: *acki_dir_on_host
    commands:
      - cp -ar $CI_WORKSPACE/.ssh ~/.ssh && chmod 700 ~/.ssh && chmod 600 ~/.ssh/id_ed25519
      - >
        ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
        "$E2E_CI_USER@$E2E_HOST"
        "bash -s -- assert $CI_PIPELINE_NUMBER" < $CI_WORKSPACE/tests/e2e/host-lease.sh
      - >
        ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$E2E_CI_USER@$E2E_HOST"
        "set +e;
        cd $ACKI_DIR;
        echo '===== docker compose ps -a (state + exit codes) =====';
        docker compose -f docker/dexdo-e2e.compose.yaml ps -a 2>/dev/null;
        for n in node0 node1 node2 node3 node4; do
          echo \"===== \$n (logs/\$n/node.log, tail 120) =====\";
          tail -n 120 $ACKI_DIR/logs/\$n/node.log 2>/dev/null;
          echo \"----- docker logs \$n (tail 60) -----\";
          docker compose -f docker/dexdo-e2e.compose.yaml logs --tail=60 \$n 2>/dev/null;
        done;
        echo '===== block_manager (logs/bm0/bm.log, tail 200) =====';
        tail -n 200 $ACKI_DIR/logs/bm0/bm.log 2>/dev/null;
        echo '----- docker logs block_manager (tail 100) -----';
        docker compose -f docker/dexdo-e2e.compose.yaml logs --tail=100 block_manager 2>/dev/null;
        true"

  net_down:
    depends_on:
      - e2e_tests
      - dump_logs
      - sdk_proof
      - sdk_parallel_acceptance
      - sdk_usdc_release
      - sdk_resting_orders
      - sdk_market_orders
      - sdk_matching_ladder
      - sdk_shutdown_orders
      - sdk_price_above_par
      - sdk_bounce_recovery
      - sdk_losing_claim
      - sdk_key_rotation
      - sdk_cancelled_event
      - sdk_bounce_deploy
      - sdk_book_segments
      - sdk_mm_cycle
      - sdk_coupon_debt
      - sdk_forfeit_close
      - sdk_oracle_quorum
      - sdk_multi_market
      - sdk_usdc_market
      - sdk_order_refusals
      - sdk_market_clock
      - sdk_exit_gates
      - sdk_oracle_admin
      - sdk_impostor_calls
      - sdk_replay
      - sdk_event_rejects
    image: *ansible_image
    directory: .acki-nacki/ansible
    when:
      - status: [ success, failure ]
    environment:
      INV: *e2e_inventory
      ACKI_DIR: *acki_dir_on_host
      E2E_HOST: { from_secret: e2e_host }
      E2E_CI_USER: { from_secret: e2e_ci_user }
    commands:
      - cp -ar $CI_WORKSPACE/.ssh ~/.ssh
      # Owner check before touching anything: if this pipeline's lease expired
      # and another one took it over, `assert` exits non-zero here and the
      # teardown below never runs -- tearing down a network this pipeline no
      # longer owns would take out whoever legitimately holds it now.
      - >
        ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
        "$E2E_CI_USER@$E2E_HOST"
        "bash -s -- assert $CI_PIPELINE_NUMBER" < $CI_WORKSPACE/tests/e2e/host-lease.sh
      - ansible-playbook dexdo-e2e-down.yml -i "$CI_WORKSPACE/$INV" -e acki_dir="$ACKI_DIR" -e full_cleanup=true
      - >
        ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
        "$E2E_CI_USER@$E2E_HOST"
        "bash -s -- release $CI_PIPELINE_NUMBER" < $CI_WORKSPACE/tests/e2e/host-lease.sh
