      E2E_CI_USER: { from_secret: e2e_ci_user }
      TEST_DATABASE_URL: { from_secret: e2e_test_database_url }   # postgres://dodex:<pw>@127.0.0.1:55432/dodex_test
      ACKI_DIR: *acki_dir_on_host
      # `E2E_READ_MODEL` is passed through in the ssh call below, not declared
      # here, because the value is a constant rather than a secret. It turns on
      # the inference binaries' read-model phases, and this is the only lane that
      # may set it: the stand runs an indexer filling the database the phases
      # poll. See `read_phases_enabled` in services/api/tests/common/read_model.rs.
      #
      # THE INDEXER-E2E SCENARIOS RUN HERE, NOT IN A STEP OF THEIR OWN. The
      # script this pipes selects by profile and by nothing else — at the pin
      # above it is `cargo nextest run --profile ci-e2e -p dodex-api
      # --run-ignored only --test-threads 4 --no-fail-fast`, with no `-E` at
      # all — so `e2e_inference_stream`, `e2e_inference_expiry_sweep` and
      # `e2e_inference_range_link` were picked up the moment they existed. A
      # separate step would have to pipe a different script (there is none) and
      # would run the whole suite twice.
      #
      # What that costs is not additive with the rest: the script runs four at a
      # time and delegates serialisation to the `serial-e2e-shared` group in
      # `.config/nextest.toml`, which all three new binaries are in. They
      # therefore queue behind each other — worst case ~9 + ~7 + ~7 minutes of
      # scene time, most of it asleep in on-chain windows — while the
      # unconstrained binaries keep overlapping them. Treat that as an upper
      # bound to be replaced by measurement: take the real per-binary times off
      # the first green stand run and correct this note.
    commands:
      - cp -ar $CI_WORKSPACE/.ssh ~/.ssh && chmod 700 ~/.ssh && chmod 600 ~/.ssh/id_ed25519
      - >
        ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
