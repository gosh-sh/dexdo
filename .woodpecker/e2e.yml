---

when:
  - event: pull_request
    branch: dev
    evaluate: 'CI_COMMIT_PULL_REQUEST_LABELS | split(",") | any(# == "local-net")'

depends_on:
  - build

variables:
  - &ansible_image "docker.gosh.sh/ansible-ubuntu:24-fix"
  # acki-nacki test/dex-4.0.30 head, carrying the RootPN._deployedValues
  # booking, the sold-0.80.0 build of RootPN, the profiled test-note fixture
  # (DEX_TEST_NOTES_SPEC, which gen_zerostate below feeds the group list this
  # stand's pool is baked from), and the stand fixes this pipeline needs to
  # run at all: the block-producer API is advertised and published on the host
  # interface (a client outside the docker network cannot follow a redirect to
  # `nodeN:8600`), and each node waits for its gossip seeds' DNS before
  # `node-helper config` resolves them, which otherwise kills whichever nodes
  # lose that race at boot.
  #
  # WHY THIS PIN MOVED: the gateway did not know `src_dapp_id`. `blockchain.events`
  # gained that argument in dodex `a47ec92`, which was validated against shellnet;
  # the image pinned here was older and answered every request with
  # `Unknown argument "src_dapp_id" on field "events" of type "BlockchainQuery"` —
  # a GraphQL VALIDATION error, so the whole query was refused rather than answered
  # empty. Pipeline #304 caught it 300 ticks out of 300: the `dex_dapp` capture
  # stream had not landed a single page since that commit, the read model stayed
  # empty, and every e2e binary that reads it went red while the chain-only ones
  # passed. `root_pn` kept working throughout — it reaches events through
  # `account(account_id, dapp_id)`, which takes no such argument — and its ticks
  # carried a real `chain_order` cursor, which is also what cleared the
  # cold-start sentinel of suspicion.
  #
  # So this pin is a MERGE of acki-nacki dev into test/dex-4.0.30, taken for
  # `gql-server`'s `src_dapp_id` argument. The first such merge (cbd25eafe, dev at
  # 87dd3f9fd "Remove transitioning #2567") is what took the stand green again:
  # pipeline #307 ran 19/19 e2e tests and all three observer anchors. This pin is
  # the second (a30002a96, dev at 72ee221c1 "Latest DEX/Bridge fixes #2423"), which
  # moves `config/zerostate`, `contracts/giver/GiverV3`, and airegistry python
  # tests this pipeline does not run — none of the four couplings dodex has to
  # acki-nacki is touched by it: `src_dapp_id` on `events`, `call-internal` in
  # zerostate-helper, the two `exchange/` trees, and the vanity addresses
  # `gen_manifest.py` reads out of the generator by regex. Check those four before
  # bumping this, not just that the images exist.
  #
  # THE FOUR DIGESTS BELOW GENUINELY COME FROM THIS SHA, and that is new. Images
  # are tagged in docker.gosh.sh by full commit sha and carry
  # `org.opencontainers.image.revision`; all four were read off the tag for this
  # commit and every label was checked against it. The previous pin did NOT have
  # this property — its digests were built from `e0f3c47e`, five commits behind the
  # `acki_sha` it sat next to — so do not read a matching pair here as an invariant
  # that has always held.
  #
  # allbin_img's digest is load-bearing beyond running the network:
  # copy_helpers takes zerostate-helper out of this image, and the booking fix
  # needs that binary's `call-internal` subcommand (tvm-debugger cannot drive
  # the call -- privateNoteDeployed emits an ext-out event and the debugger
  # discards the resulting state). Verified present in this exact digest. An
  # older all-bin fails the generator rather than the preflight.
  #
  # It is also why all four images come from the merge rather than from dev's own
  # build, which would have been available without waiting for CI: `call-internal`
  # is +121 lines that exist ONLY on this test branch, so a `latest-dev` all-bin
  # would take `gen_zerostate` down. Outside `contracts/`, the merge differs from
  # dev in six files and the only Rust among them is that helper — node, gql-server
  # and block-manager are source-identical either way — but pinning one image from a
  # different commit than the other three buys nothing and has to be explained
  # forever.
  #
  # The digests are immutable, but ACKI_SHA is a commit on a TEST branch:
  # acki_clone fetches it by SHA, so a force-push that makes it unreachable
  # breaks the clone step while the images keep working. That branch was
  # already rewritten once (the commits an earlier pin replaced no longer exist),
  # so the risk is real, not theoretical -- move the pin to a `dev` commit once
  # this work lands there.
  #
  # WHAT THE MERGE CHANGES IN WHAT THE STAND BAKES. `tests/e2e/stage_contracts.sh`
  # `rm -rf`s and rewrites `contracts/{dex,airegistry}` from THIS dodex checkout
  # before the generator runs, so the pinned commit's own version of those is
  # irrelevant. Everything else under `contracts/` is NOT staged and comes from the
  # pin — and dev moves it here: `USDCBridge` is renamed to `eccUSDCBridge` (source,
  # ABI and TVC), `DepositVoucher` is rebuilt, and Sepolia bridge constants are
  # added. None of that is on any path this pipeline exercises, but it is the reason
  # "the versions may drift freely" is the wrong reading: the staging holds for two
  # directories, and a contract added outside those two allowlists would be taken
  # from the pin instead.
  - &acki_sha "a30002a96acbfb036b9d8c946a828fda28368eb3"
  - &allbin_img "docker.gosh.sh/ackinacki-all-bin@sha256:ddbbb900d37bf69920d697b564b93228b48bf7a2fd3c4ad01804092231bde480"
  - &node_img "docker.gosh.sh/ackinacki-node@sha256:e28d8223c50421ce46699f3595d9d28addf8bbf17b91c12859c6df198f2062c3"
  - &gql_img "docker.gosh.sh/ackinacki-gql-server@sha256:459e4da53e0d3eb59ec01e4f91536bfaebf74aa0c6ddd3c416a38bec9638e889"
  - &bm_img "docker.gosh.sh/ackinacki-block-manager@sha256:c21b6df4b23f6e2a76a9eb1250c08173c6f27033c726351e48fd377872b1a05a"
  - &node_image_tag "latest-dev"
  - &busybox_image "busybox:musl"
  - &tvm_cli_version "v3.0.4-rc.an"
  # Compiler per CONTRACT, not per directory. RootPN and exchange/USDCBridge
  # are 0.80.0; the other twelve DEX/airegistry contracts and
  # exchange/DepositVoucher are 0.81.0. This pipeline compiles only the
  # thirteen that stage_contracts.sh stages, so it needs both compilers --
  # never one for the whole tree.
  - &sold_version "gosh_0.81.0"
  - &sold_sha256 "79b43aab6ae2fdc35c1cb3b486453aa2cf4f2718c58b69ccefab1122c704853c"
  # RootPN.sol is compiled with 0.80.0 permanently, not because that is what
  # produced the current committed bytes. Anything else silently breaks the v1
  # ext-out header the voucher prover reads.
  - &sold_old_version "gosh_0.80.0"
  - &sold_old_sha256 "389cf0ede80fc3acb5f904f950808383504ec3341cdc6b9132e850298db0c246"
  # The note pool the stand is baked with, as groups rather than a count.
  # Relative to $CI_WORKSPACE; the generator takes either a path or the JSON
  # itself. Both suites that read the resulting pool own their notes by label,
  # so the order of the groups here decides only which deposit_hash each gets.
  - &dex_test_notes_spec "tests/e2e/dex_test_notes.spec.json"
  - &inventory_branch "main"
  - &e2e_inventory ".inventory/ansible/inventory/dexdo/e2e/dexdo-infra.yml"
  - &acki_dir_on_host "/opt/acki-nacki"
  - &seed_notes_ws ".acki-nacki/config/dex_test_notes.keys.json"

steps:
  acki_clone:
    image: *ansible_image
    environment:
      GITHUB_TOKEN: { from_secret: GITHUB_TOKEN }
      ACKI_REPO: { from_secret: acki_repo_url }
      ACKI_SHA: *acki_sha
    commands:
      - printf 'machine github.com\nlogin x-access-token\npassword %s\n' "$GITHUB_TOKEN" > ~/.netrc && chmod 600 ~/.netrc
      - rm -rf .acki-nacki
      - git clone "$ACKI_REPO" .acki-nacki
      - git -C .acki-nacki fetch --depth 1 origin "$ACKI_SHA" && git -C .acki-nacki checkout -f FETCH_HEAD
      - rm -f ~/.netrc

  copy_static_shell:
    depends_on:
      - acki_clone
    image: *busybox_image
    directory: .acki-nacki
    commands:
      - cp /bin/sh /bin/mkdir /bin/cp ./

  copy_helpers:
    depends_on:
      - copy_static_shell
    image: *allbin_img
    directory: .acki-nacki
    entrypoint:
      - ./sh
      - -c
      - ./mkdir -p .bin && ./cp /usr/local/bin/node-helper /usr/local/bin/zerostate-helper .bin/

  gen_zerostate:
    depends_on:
      - copy_helpers
    image: *ansible_image
    directory: .acki-nacki
    environment:
      TVM_VER: *tvm_cli_version
      SOLD_VER: *sold_version
      SOLD_SHA256: *sold_sha256
      SOLD_OLD_VER: *sold_old_version
      SOLD_OLD_SHA256: *sold_old_sha256
      DEX_TEST_NOTES_SPEC: *dex_test_notes_spec
      ACKI_SHA: *acki_sha
      DEXDO_NODE_IMG: *node_img
      DEXDO_GQL_IMG: *gql_img
      DEXDO_BM_IMG: *bm_img
      DEXDO_ALLBIN_IMG: *allbin_img
    commands:
      - rm -f sh mkdir cp
      - apt-get update -qq && apt-get install -yqq --no-install-recommends make curl ca-certificates >/dev/null
      # prebuilt helpers -> where generate_zerostate.py looks (./target/release)
      - mkdir -p target/release contracts/compiler
      - cp .bin/node-helper .bin/zerostate-helper target/release/ && chmod +x target/release/*
      # contract toolchain (tvm-cli/tvm-debugger/sold) -> contracts/compiler, which
      # tests/helper/common.py resolves by default (COMPILER_DIR). Download the
      # exact versions acki-nacki CI pins so glibc/ABI match this runner.
      - curl -sSL "https://github.com/tvmlabs/tvm-sdk/releases/download/$TVM_VER/tvm-cli-$${TVM_VER#v}-x86_64.tar.gz" | tar xz -C contracts/compiler
      - curl -sSL "https://github.com/tvmlabs/tvm-sdk/releases/download/$TVM_VER/tvm-debugger-$${TVM_VER#v}-x86_64.tar.gz" | tar xz -C contracts/compiler
      # sold is verified before use, like sold_old below: an unverified
      # compiler decides the bytecode every downstream hash in this pipeline
      # is taken over, so it is the last thing that should be fetched on trust.
      - curl -fsSL -o /tmp/sold.tar.gz "https://github.com/gosh-sh/TVM-Solidity-Compiler/releases/download/$SOLD_VER/sold_$${SOLD_VER}_linux_x86_64.tar.gz"
      - echo "$SOLD_SHA256  /tmp/sold.tar.gz" | sha256sum -c -
      - tar xz -f /tmp/sold.tar.gz -C contracts/compiler
      - chmod +x contracts/compiler/*
      # sold_old — compiler 0.80.0, the version RootPN.sol must be compiled
      # with (the voucher prover parses RootPN's ext-out event and only this
      # compiler emits the v1 header layout it can read). Named `sold_old`
      # after the variable cascade_pins.py expects, not after any claim about
      # its version ordering: 0.80.0 is in fact the LOWER of the two, and the
      # other twelve contracts compile with 0.81.0. Unpacks to a temp
      # directory, never straight into contracts/compiler: that directory
      # already holds the `sold` those twelve need.
      - curl -fsSL -o /tmp/sold_old.tar.gz "https://github.com/gosh-sh/TVM-Solidity-Compiler/releases/download/$SOLD_OLD_VER/sold_$${SOLD_OLD_VER}_linux_x86_64.tar.gz"
      - echo "$SOLD_OLD_SHA256  /tmp/sold_old.tar.gz" | sha256sum -c -
      - mkdir -p /tmp/sold_old_x && tar xz -f /tmp/sold_old.tar.gz -C /tmp/sold_old_x
      - mv /tmp/sold_old_x/sold contracts/compiler/sold_old
      # Both compilers also ship inside the pinned checkout
      # (contracts/compiler/sold{,_old}) as of acki-nacki bcc4667a0, so these
      # downloads are strictly optional. They stay because a sha256-verified
      # release asset is checkable on its own terms, while bytes in a checkout
      # are only as pinned as the commit that carries them.
      - test -x contracts/compiler/sold_old && test -x contracts/compiler/sold
      - export PATH="$CI_WORKSPACE/.acki-nacki/contracts/compiler:$PATH"
      # Stages contracts/{dex,airegistry} fresh from this dodex checkout into the
      # generator's versioned paths and writes the provenance manifest from those
      # staged artifacts, before `make compile_contracts` builds the giver/test
      # contracts as before and the generator bakes everything into the
      # zerostate.
      - export BUILD_DIR="$CI_WORKSPACE/.acki-nacki" DODEX_DIR="$CI_WORKSPACE"
      - bash "$CI_WORKSPACE/tests/e2e/stage_contracts.sh"
      - make compile_contracts
      # DISABLE_BLACKLIST skips deploying the blacklist indexer
      # (generate_zerostate.py:682) and is what acki-nacki's own ci_test targets
      # pass. Nothing in the DEX contracts or in these suites touches that
      # contract, and skipping it takes a noticeable slice off generation.
      #
      # The generator tests the variable's PRESENCE, not its value
      # (`os.getenv(...) is not None`), so `DISABLE_BLACKLIST=0` would disable
      # the blacklist just as thoroughly. To re-enable it, remove the
      # assignment — do not set it to a falsy value.
      - DEX_TEST_NOTES_SPEC="$CI_WORKSPACE/$DEX_TEST_NOTES_SPEC" DISABLE_BLACKLIST=true python3 contracts/scripts/generate_zerostate.py
      - test -f config/zerostate && test -f config/block_manager1_signing.keys.json && test -f docker/.env && test -f config/dex_contracts_manifest.json

  inventory_clone:
    image: *ansible_image
    environment:
      GITHUB_TOKEN: { from_secret: GITHUB_TOKEN }
      INVENTORY_REPO: { from_secret: inventory_repo_url }
      INVENTORY_BRANCH: *inventory_branch
    commands:
      - printf 'machine github.com\nlogin x-access-token\npassword %s\n' "$GITHUB_TOKEN" > ~/.netrc && chmod 600 ~/.netrc
      - rm -rf .inventory
      - git clone --depth 1 --branch "$INVENTORY_BRANCH" "$INVENTORY_REPO" .inventory
      - rm -f ~/.netrc

  remember_ssh_key:
    image: *ansible_image
    environment:
      SSH_NET_KEY: { from_secret: ssh_dodex_ci }
    commands:
      - mkdir -p ~/.ssh
      - echo "$SSH_NET_KEY" | tr '@' '\n' > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
      - cp -ar ~/.ssh ./.ssh

  prepare_host:
    depends_on:
      - acki_clone
      - inventory_clone
      - remember_ssh_key
    image: *ansible_image
    directory: .acki-nacki/ansible
    environment:
      INV: *e2e_inventory
    commands:
      - cp -ar $CI_WORKSPACE/.ssh ~/.ssh
      - ansible-playbook install-rust-python.yaml -i "$CI_WORKSPACE/$INV"
      - ansible-playbook dexdo-e2e-prepare.yml -i "$CI_WORKSPACE/$INV"

  # Host-wide pipeline lease (tests/e2e/host-lease.sh): more than one pipeline
  # can reach the shared e2e host, but `up.sh` tears down and recreates the
  # whole stand as its first act, so only one pipeline may hold it at a time.
  # This is distinct from ledger.lock/b0.lock, which arbitrate processes within
  # a single run. Always piped from this checkout, never run off host B's own
  # disk -- see the script's header for why.
  #
  # Acquired after prepare_host runs unleased: dexdo-e2e-prepare.yml only
  # installs build-essential and adds the CI user to the docker group, both
  # idempotent, and it never touches the stand directory or anything a live
  # run reads, so two pipelines running it concurrently cannot corrupt each
  # other. Acquiring any earlier would hold the lease across a step that
  # doesn't need its protection.
  lease_acquire:
    depends_on:
      - prepare_host
      - gen_zerostate
    image: *ansible_image
    environment:
      E2E_HOST: { from_secret: e2e_host }
      E2E_CI_USER: { from_secret: e2e_ci_user }
    commands:
      - cp -ar $CI_WORKSPACE/.ssh ~/.ssh && chmod 700 ~/.ssh && chmod 600 ~/.ssh/id_ed25519
      - >
        ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
        "$E2E_CI_USER@$E2E_HOST"
        "bash -s -- acquire $CI_PIPELINE_NUMBER" < $CI_WORKSPACE/tests/e2e/host-lease.sh
      # The run's start, for the observer's window (the `observer` step), stamped only
      # once the lease is OURS. Stamping earlier is wrong rather than merely imprecise:
      # `lease_acquire` blocks for as long as another pipeline holds the host, and the
      # stand's Postgres outlives pipelines, so a mark taken before that wait would open
      # the window over the other run's writes — its books could then fail our observer,
      # or satisfy our positive anchor without a single event of our own ever arriving.
      # Nothing of ours is cut off by stamping here: every write this run makes comes
      # after `net_up`, well past this point. Woodpecker does not carry the environment
      # between steps, so the mark travels as a file. What goes to the observer is not
      # the mark itself but the ELAPSED time: the host reconstructs the start against
      # its own clock, keeping any runner/stand clock skew out of the window.
      - date +%s > $CI_WORKSPACE/.e2e_started_at

  assert_net_up:
    depends_on:
      - lease_acquire
    image: *ansible_image
    environment:
      E2E_HOST: { from_secret: e2e_host }
      E2E_CI_USER: { from_secret: e2e_ci_user }
    commands:
      - cp -ar $CI_WORKSPACE/.ssh ~/.ssh && chmod 700 ~/.ssh && chmod 600 ~/.ssh/id_ed25519
      - >
        ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
        "$E2E_CI_USER@$E2E_HOST"
        "bash -s -- assert $CI_PIPELINE_NUMBER" < $CI_WORKSPACE/tests/e2e/host-lease.sh

  net_up:
    depends_on:
      - assert_net_up
    image: *ansible_image
    directory: .acki-nacki/ansible
    environment:
      INV: *e2e_inventory
      ACKI_DIR: *acki_dir_on_host
      GITHUB_TOKEN: { from_secret: GITHUB_TOKEN }
      ACKI_REPO: { from_secret: acki_repo_url }
      ACKI_BRANCH: *acki_sha
      NODE_IMAGE_TAG: *node_image_tag
      NODE_IMG: *node_img
      GQL_IMG: *gql_img
      BM_IMG: *bm_img
    commands:
      - cp -ar $CI_WORKSPACE/.ssh ~/.ssh
      # NODE_IMG/GQL_IMG/BM_IMG travel as -e args below: the playbook forwards
      # dexdo_*_image into up.sh's process environment for the compose
      # invocation, and process environment overrides docker/.env's
      # interpolation, so pinning through .env instead would be silently
      # ignored. dexdo_net_image_tag stays as the fallback tag for anything
      # compose starts that these three pins don't cover.
      - >
        ansible-playbook dexdo-e2e-up.yml
        -i "$CI_WORKSPACE/$INV"
        -e acki_dir="$ACKI_DIR"
        -e config_src="$CI_WORKSPACE/.acki-nacki/config"
        -e env_src="$CI_WORKSPACE/.acki-nacki/docker/.env"
        -e endpoint_host_dest="$CI_WORKSPACE/acki_net_host"
        -e dexdo_net_image_tag="$NODE_IMAGE_TAG"
        -e dexdo_node_image="$NODE_IMG"
        -e dexdo_gql_image="$GQL_IMG"
        -e dexdo_bm_image="$BM_IMG"

  # SDK proof/acceptance run on host B itself, not the CI runner: the tvm
  # client follows the block-producer redirect straight to nodeN:8600, which
  # only resolves off host B's own docker bridge. Both steps sync
  # dodex@$CI_COMMIT_SHA on the host and assert the lease internally
  # (tests/e2e/sdk-proof-on-host.sh) rather than through a preceding
  # mini-step.
  #
  # They run before deploy_dexdo and that order is load-bearing: the proof
  # scenario's preflight asserts a pristine zerostate (RootPN's deploy book
  # equals the seed pool's sum), and deploy_dexdo seeds accounts, which puts
  # the book permanently above it. Moving these steps after or alongside
  # deploy_dexdo would fail them for a reason unrelated to the code they test.
  #
  # Both are blocking. They were not, until each had completed a green run
  # against a real stand — the condition that made a failure here at least as
  # likely to be the step's own immaturity as a defect in the code. Both have
  # now done so, so a failure is a defect and must stop the pipeline: an
  # ignored failure keeps its step's state visible but leaves the pipeline
  # green, which is precisely how a regression in the harness would go
  # unnoticed.
  #
  # ── the SDK scenarios run in four lanes ──────────────────────────────────
  #
  # `sdk_proof` runs alone, ahead of everything, for two reasons that happen to
  # coincide: it is the only scenario that takes `b0.lock` EXCLUSIVELY (it is
  # the conservation run and needs a chain nobody else is moving), and it is the
  # only one that bootstraps the ledger generation every other step joins
  # (`E2E_RUN_ID`). Every other scenario takes the lock SHARED, which is the
  # harness saying it was built to run beside its peers.
  #
  # After it the 24 remaining scenarios fan out into four chains. They were a
  # single 91-minute chain until 2026-08-02, which put the pipeline 3 minutes
  # under the repo's 120-minute cap before wave 6 added anything — #203 then
  # went over and was cancelled mid-run, which skips teardown and strands the
  # host lease. Almost all of that 91 minutes is a scenario ASLEEP waiting out a
  # staking window, a result window or a drain, so the lanes overlap the waiting
  # rather than the work: the longest lane is ~21 minutes.
  #
  # The lanes are balanced by the per-step durations pipeline #202 measured, not
  # by scenario count. Re-balance them from a real run rather than by eye if a
  # scenario's cost changes — the numbers are in the pipeline API, and the
  # per-step overhead is 8 seconds, so a step's duration IS its test's duration.
  #
  # Two placements are deliberate rather than incidental:
  #   * `usdc_market` and `usdc_release` share a lane. They are the only
  #     consumers of the `PN-USDC` group, which the stand spec bakes 4 of, and
  #     between them they want exactly 4 — in different lanes they could hold
  #     them at the same moment and one would fail to rent.
  #   * `parallel_acceptance` sits in a lane rather than beside `proof`: it
  #     spawns two processes of its own, so it is already the widest single
  #     step, and it is cheap enough (29s) to sit anywhere.
  #
  # Note-pool sizing needs no change: `SCENARIOS_RENT` counts what the suite
  # spends per GENERATION, not what it holds at once, and a quarantined note
  # never returns within one. Peak concurrency rises from 1 scenario to 4; total
  # consumption is what it always was.
  #
  # The known hazard, written down because it is easy to misread when it bites:
  # the root singletons (`RootOracle`, `RootPN`) are addressed by every
  # scenario, with EXTERNAL messages. An external message carries a `timestamp`
  # header, and the contract compares it against the last stamp it accepted —
  # so two lanes deploying against the same singleton do not have to collide
  # inside a millisecond for one to lose. Arriving out of order is enough, and
  # the older stamp is thrown out with exit_code 52, which the TVM Solidity
  # runtime defines as "Replay protection exception".
  #
  # It bit in #223: `exit_gates` died on `deployOracle` four seconds in.
  # `common::misc::send_past_replay_guard` now re-sends on exactly that code —
  # safe because 52 is raised BEFORE `tvm.accept()`, so the rejected message was
  # never applied and the retry is a first attempt, not a second.
  #
  # Do not read the RootOracle top-up line above such a failure as the cause.
  # #223 printed one that had not moved the balance, which was true and
  # unrelated — and the "fix" for it broke all twenty-five scenarios in #226.
  # That top-up is ALLOWED to do nothing: `RootOracle`'s native balance on a
  # from-scratch stand reads negative, no giver credit brings it positive, and
  # every scenario deploys against it anyway because the contract mints its own
  # gas in `ensureBalance()`. The threshold it is compared against is advisory.
  sdk_proof:
    depends_on:
      - net_up
    image: *ansible_image
    environment:
      E2E_HOST: { from_secret: e2e_host }
      E2E_CI_USER: { from_secret: e2e_ci_user }
      ACKI_DIR: *acki_dir_on_host
    commands:
      - cp -ar $CI_WORKSPACE/.ssh ~/.ssh && chmod 700 ~/.ssh && chmod 600 ~/.ssh/id_ed25519
      - >
        ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
        -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes
        "$E2E_CI_USER@$E2E_HOST"
        "DEXDO_SHA='$CI_COMMIT_SHA'
        E2E_RUN_ID='$CI_PIPELINE_NUMBER'
        PIPELINE_ID='$CI_PIPELINE_NUMBER'
        SUITE=proof
        ACKI_DIR='$ACKI_DIR'
        bash -s" < $CI_WORKSPACE/tests/e2e/sdk-proof-on-host.sh

  # HOW THE SDK STEPS ARE PLACED, and why it is by DURATION rather than by
  # theme.
  #
  # Woodpecker does not run this DAG as chains. It flattens it into STAGES by
  # dependency depth and runs each stage to completion before starting the
  # next, so a level is a BARRIER: it costs its slowest member, and the other
  # three lanes sit idle for the difference. Pipeline #298 showed what that
  # buys when the levels are themed rather than balanced — `sdk_losing_claim`
  # (293s) alone with `sdk_usdc_release` (13s) in a level of their own, and
  # `sdk_coupon_debt` (718s) holding three lanes for up to 315s each. 1972s
  # against a 1402s ideal.
  #
  # So the four lanes are filled column-wise from the durations sorted
  # descending: level 1 takes the four longest, level 2 the next four, and so
  # on. Same width, same host, same contention — 1789s instead of 1972s, and
  # the arithmetic is reproducible from any run's step timings.
  #
  # ORDER IS OTHERWISE FREE, which is what makes the balancing legal. Twenty of
  # the twenty-six scenarios never call `release_clean`, so they quarantine
  # what they rent and the generation's total note demand is the same however
  # they are sequenced; only the ONE constraint on `sdk_usdc_release` below is
  # real. Comments elsewhere in this file used to argue that a note-spending
  # scenario must run last — that argument applies to almost all of them and
  # therefore orders nothing.
  #
  # Widening past four is the next lever and is NOT taken here: five lanes
  # model at ~1494s and six at ~1328s, but four is a measured constant (#206,
  # 2026-08-02, 1-3% per-scenario slowdown) and more lanes mean more external
  # `deployOracle` messages racing the one RootOracle, whose replay guard
  # answers a lost race with exit_code 52.
  #
  # Depends on sdk_proof: the two share the host lease and the stand, and
  # running them concurrently would have them rent notes from the same pool at
  # the same time.
  # From here on every step declares `status: [success, failure]`. The chain of
  # `depends_on` is what orders these steps on the one host they share; it is
  # not a statement that each needs the previous to have passed. Without the
  # clause a single failing scenario skips every later one, so a run reports
  # the first broken thing and says nothing about the other nine -- four
  # consecutive pipelines cost an hour each to surface one failure at a time.
  # The stand is still up and the lease still held, so they may as well run.
  #
  # `sdk_proof` deliberately keeps no clause of its own: it is the step that
  # opens the ledger generation the others lease their notes from. If it fails
  # they will fail too, but quickly and with a legible allocator error rather
  # than by being invisible.
  sdk_parallel_acceptance:
    when:
      - status: [success, failure]
    depends_on:
      - sdk_event_rejects
    image: *ansible_image
    environment:
      E2E_HOST: { from_secret: e2e_host }
      E2E_CI_USER: { from_secret: e2e_ci_user }
      ACKI_DIR: *acki_dir_on_host
    commands:
      - cp -ar $CI_WORKSPACE/.ssh ~/.ssh && chmod 700 ~/.ssh && chmod 600 ~/.ssh/id_ed25519
      - >
        ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
        -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes
        "$E2E_CI_USER@$E2E_HOST"
        "DEXDO_SHA='$CI_COMMIT_SHA'
        E2E_RUN_ID='$CI_PIPELINE_NUMBER'
        PIPELINE_ID='$CI_PIPELINE_NUMBER'
        SUITE=acceptance
        ACKI_DIR='$ACKI_DIR'
        bash -s" < $CI_WORKSPACE/tests/e2e/sdk-proof-on-host.sh

  # The USDC release path, in its own step because it is the one scenario
  # whose whole point is a token type nothing else on this stand touches.
  #
  # THE ONE ORDERING CONSTRAINT IN THIS WHOLE BLOCK, and the reason it sits at
  # the end of a lane rather than wherever the balancing above would have put
  # it: it quarantines PN-USDC notes for the rest of the generation, and
  # `sdk_usdc_market` needs them. Anything else may be moved freely; this may
