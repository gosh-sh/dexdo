      - sdk_order_refusals
      - sdk_market_clock
      - sdk_exit_gates
      - sdk_oracle_admin
      - sdk_impostor_calls
      - sdk_replay
      - sdk_event_rejects
    image: *ansible_image
    when:
      - status: [ failure ]
    environment:
      E2E_HOST: { from_secret: e2e_host }
      E2E_CI_USER: { from_secret: e2e_ci_user }
      ACKI_DIR: *acki_dir_on_host
      # `dexdo_deploy_dir` from deploy/ansible/roles/dexdo/defaults/main.yml. Named
      # here rather than inlined below for the same reason ACKI_DIR is: the host
      # path is deployment configuration, and a copy buried in a quoted ssh command
      # is the copy nobody updates.
    commands:
      - cp -ar $CI_WORKSPACE/.ssh ~/.ssh && chmod 700 ~/.ssh && chmod 600 ~/.ssh/id_ed25519
      - >
        ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
        "$E2E_CI_USER@$E2E_HOST"
        "bash -s -- assert $CI_PIPELINE_NUMBER" < $CI_WORKSPACE/tests/e2e/host-lease.sh
      - >
        ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$E2E_CI_USER@$E2E_HOST"
        "set +e;
        cd $ACKI_DIR;
        echo '===== docker compose ps -a (state + exit codes) =====';
        docker compose -f docker/dexdo-e2e.compose.yaml ps -a 2>/dev/null;
        for n in node0 node1 node2 node3 node4; do
          echo \"===== \$n (logs/\$n/node.log, tail 120) =====\";
          tail -n 120 $ACKI_DIR/logs/\$n/node.log 2>/dev/null;
          echo \"----- docker logs \$n (tail 60) -----\";
          docker compose -f docker/dexdo-e2e.compose.yaml logs --tail=60 \$n 2>/dev/null;
        done;
        echo '===== block_manager (logs/bm0/bm.log, tail 200) =====';
        tail -n 200 $ACKI_DIR/logs/bm0/bm.log 2>/dev/null;
        echo '----- docker logs block_manager (tail 100) -----';
        docker compose -f docker/dexdo-e2e.compose.yaml logs --tail=100 block_manager 2>/dev/null;
        true"
      # DEXDO'S OWN SERVICES, and their absence here is why #300 took three guesses
      # to diagnose. Everything above is the CHAIN — five nodes and the block
      # manager — while the failure being investigated was in our indexer: the read
      # model stayed empty and nothing in this dump could say why, because the
      # indexer was the one process not being asked.
      #
      # NOTHING IS ADDRESSED BY DEPLOY PATH, and that is the correction pipeline #303
      # forced. The first version of this block drove `docker compose -f
      # $DEXDO_DIR/compose.yml`, taking `/opt/dexdo` from
      # `deploy/ansible/roles/dexdo/defaults/main.yml`. On the stand it produced four
      # empty sections and no explanation: the e2e inventory lives in a private repo
      # (`inventory_clone`) and is free to override `dexdo_deploy_dir` — the shipped
      # `stage.example` already does, to `/opt/dodex-stage`. A diagnostic that has to
      # guess a path it cannot read is a diagnostic that reports nothing on the run it
      # was added for.
      #
      # `docker ps -a --filter name=…` needs no path and no compose file, and `-q`
      # keeps it free of Go templates (`--format '{{.Names}}'`), which appear nowhere
      # else in this file and whose interaction with Woodpecker's own templating is
      # not worth discovering during an incident.
      #
      # Two sources per service, and both are needed. `docker logs` carries what a
      # crash-looping container printed before it died, which the file log never
      # receives; the file log is what `dodex-logging` writes and survives a container
      # restart, which the docker log does not. It is read through `docker exec` at
      # the container's own `/app/logs` — the in-container path is fixed by the
      # compose bind mount, so it holds whatever the host path turns out to be.
      # The glob is `*.log*`, not `*.log`: `dodex-logging` rotates daily and writes
      # `<svc>.log.<date>` (plus `<svc>.noise.log`), so the narrower pattern matches
      # nothing at all. `ls -la` runs beside it so the next reader learns the real
      # names from the dump instead of from this comment.
      #
      # NO `2>/dev/null` ANYWHERE BELOW. That was the second half of the #303 failure:
      # every command was silenced, so a wrong path and a genuinely empty log were the
      # same output. stderr is the answer here, not noise.
      #
      # The indexer goes first and gets the larger tail: it ticks capture every 3s,
      # so its recent history is dense and it is the service most read-model
      # symptoms trace back to.
      - >
        ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$E2E_CI_USER@$E2E_HOST"
        "set +e;
        echo '===== every container on the host (docker ps -a) =====';
        docker ps -a;
        for svc in indexer api; do
          case \$svc in indexer) N=300;; *) N=120;; esac;
          for id in \$(docker ps -a --filter name=\$svc -q); do
            echo \"===== dexdo \$svc [\$id] (docker logs, tail \$N) =====\";
            docker logs --tail=\$N \$id 2>&1;
            echo \"----- \$svc [\$id] file log, /app/logs (tail \$N) -----\";
            docker exec \$id sh -c \"ls -la /app/logs; tail -n \$N /app/logs/*.log*\" 2>&1;
          done;
        done;
        true"

  # The observer. It creates no traffic — it checks what the scenarios left behind,
  # so it runs last. `status: [success, failure]` is not about leniency: a run in which
  # a scenario failed needs the diagnosis all the more, and without the clause a single
  # failed scenario would skip this step entirely.
  #
  # `depends_on` here is the same list as `dump_logs`, i.e. every scenario step; and
  # `net_down` below waits for THIS step. Without the second half the change would be
  # not merely useless but dangerous: order is set only by `depends_on`, so Woodpecker
  # would tear down the stand and release the lease in parallel with reading its
  # database.
  observer:
    when:
      - status: [ success, failure ]
    depends_on:
      - e2e_tests
      - sdk_proof
      - sdk_parallel_acceptance
      - sdk_usdc_release
      - sdk_resting_orders
      - sdk_market_orders
      - sdk_matching_ladder
      - sdk_shutdown_orders
      - sdk_price_above_par
      - sdk_bounce_recovery
      - sdk_losing_claim
      - sdk_key_rotation
      - sdk_cancelled_event
      - sdk_bounce_deploy
      - sdk_book_segments
      - sdk_mm_cycle
      - sdk_coupon_debt
      - sdk_forfeit_close
      - sdk_oracle_quorum
      - sdk_multi_market
      - sdk_usdc_market
      - sdk_order_refusals
      - sdk_market_clock
      - sdk_exit_gates
      - sdk_oracle_admin
      - sdk_impostor_calls
      - sdk_replay
      - sdk_event_rejects
    image: *ansible_image
    environment:
      E2E_HOST: { from_secret: e2e_host }
      E2E_CI_USER: { from_secret: e2e_ci_user }
      TEST_DATABASE_URL: { from_secret: e2e_test_database_url }
    commands:
      - cp -ar $CI_WORKSPACE/.ssh ~/.ssh && chmod 700 ~/.ssh && chmod 600 ~/.ssh/id_ed25519
      - export E2E_ELAPSED_SECONDS=$(( $(date +%s) - $(cat $CI_WORKSPACE/.e2e_started_at) ))
      - >
        ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
        -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes
        "$E2E_CI_USER@$E2E_HOST"
        "DEXDO_SHA='$CI_COMMIT_SHA'
        PIPELINE_ID='$CI_PIPELINE_NUMBER'
        TEST_DATABASE_URL='$TEST_DATABASE_URL'
        E2E_ELAPSED_SECONDS='$E2E_ELAPSED_SECONDS'
        bash -s" < $CI_WORKSPACE/tests/e2e/observer-on-host.sh

  net_down:
    depends_on:
      - observer
      - e2e_tests
      - dump_logs
      - sdk_proof
      - sdk_parallel_acceptance
      - sdk_usdc_release
      - sdk_resting_orders
      - sdk_market_orders
      - sdk_matching_ladder
      - sdk_shutdown_orders
      - sdk_price_above_par
      - sdk_bounce_recovery
      - sdk_losing_claim
      - sdk_key_rotation
      - sdk_cancelled_event
      - sdk_bounce_deploy
      - sdk_book_segments
      - sdk_mm_cycle
      - sdk_coupon_debt
      - sdk_forfeit_close
      - sdk_oracle_quorum
      - sdk_multi_market
      - sdk_usdc_market
      - sdk_order_refusals
      - sdk_market_clock
      - sdk_exit_gates
      - sdk_oracle_admin
      - sdk_impostor_calls
      - sdk_replay
      - sdk_event_rejects
    image: *ansible_image
    directory: .acki-nacki/ansible
    when:
      - status: [ success, failure ]
    environment:
      INV: *e2e_inventory
      ACKI_DIR: *acki_dir_on_host
      E2E_HOST: { from_secret: e2e_host }
      E2E_CI_USER: { from_secret: e2e_ci_user }
    commands:
      - cp -ar $CI_WORKSPACE/.ssh ~/.ssh
      # Owner check before touching anything: if this pipeline's lease expired
      # and another one took it over, `assert` exits non-zero here and the
      # teardown below never runs -- tearing down a network this pipeline no
      # longer owns would take out whoever legitimately holds it now.
      - >
        ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
        "$E2E_CI_USER@$E2E_HOST"
        "bash -s -- assert $CI_PIPELINE_NUMBER" < $CI_WORKSPACE/tests/e2e/host-lease.sh
      - ansible-playbook dexdo-e2e-down.yml -i "$CI_WORKSPACE/$INV" -e acki_dir="$ACKI_DIR" -e full_cleanup=true
      - >
        ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
        "$E2E_CI_USER@$E2E_HOST"
        "bash -s -- release $CI_PIPELINE_NUMBER" < $CI_WORKSPACE/tests/e2e/host-lease.sh
