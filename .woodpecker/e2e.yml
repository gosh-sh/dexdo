  assert_deploy_dexdo:
    when:
      - status: [success, failure]
    # The four LANE TAILS, and nothing else. A dependency list of individual
    # steps looks equivalent and is not: `sdk_book_segments` sits third of six
    # in lane 1, so naming it lets this step start while `resting_orders`,
    # `price_above_par` and `cancelled_event` are still writing to the chain.
    # The api-e2e step below then deploys and trades beside them — and every
    # market deploy sends an external `deployOracle` to the one shared
    # RootOracle, where the loser of a timestamp race is rejected outright
    # (exit_code 52, replay protection).
    #
    # Depending on a tail waits for its whole lane, because each step in a lane
    # already depends on the one before it. So these four say what the earlier
    # list only happened to mean while the timings held.
    depends_on:
      - sdk_bounce_deploy
      - sdk_bounce_recovery
      - sdk_parallel_acceptance
      - sdk_usdc_release
    image: *ansible_image
    environment:
      E2E_HOST: { from_secret: e2e_host }
      E2E_CI_USER: { from_secret: e2e_ci_user }
    commands:
      - cp -ar $CI_WORKSPACE/.ssh ~/.ssh && chmod 700 ~/.ssh && chmod 600 ~/.ssh/id_ed25519
      - >
        ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
        "$E2E_CI_USER@$E2E_HOST"
        "bash -s -- assert $CI_PIPELINE_NUMBER" < $CI_WORKSPACE/tests/e2e/host-lease.sh

  deploy_dexdo:
    when:
