        E2E_SEED_NOTES='$ACKI_DIR/config/dex_test_notes.keys.json'
        TEST_DATABASE_URL='$TEST_DATABASE_URL'
        E2E_READ_MODEL='1'
        bash -s" < .acki-nacki/tests/dexdo/e2e-on-host.sh

  dump_logs:
    depends_on:
      - e2e_tests
      - sdk_proof
      - sdk_parallel_acceptance
      - sdk_usdc_release
      - sdk_resting_orders
      - sdk_market_orders
      - sdk_matching_ladder
      - sdk_shutdown_orders
      - sdk_price_above_par
      - sdk_bounce_recovery
      - sdk_losing_claim
      - sdk_key_rotation
      - sdk_cancelled_event
      - sdk_bounce_deploy
