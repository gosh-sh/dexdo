---

when:
  - event: pull_request
    branch: dev
  - event: manual

depends_on:
  - build

variables:
  - &ansible_image "docker.gosh.sh/ansible-ubuntu:24-fix"
  - &rust_image "rustlang/rust:nightly-bookworm"
  - &acki_branch "deploy/poseidon_dex_ansible"
  - &inventory_branch "feature/add-e2e-dexdo-inv"
  - &e2e_inventory ".inventory/ansible/inventory/dexdo/e2e/dexdo-infra.yml"
  - &acki_dir_on_host "/opt/acki-nacki"
  - &db_host_port "55432"
  - &seed_notes_ws "dex_test_notes.keys.json"

steps:
  acki_clone:
    image: *ansible_image
    environment:
      GITHUB_TOKEN: { from_secret: GITHUB_TOKEN }
      ACKI_REPO: { from_secret: acki_repo_url }
      ACKI_BRANCH: *acki_branch
    commands:
      - printf 'machine github.com\nlogin x-access-token\npassword %s\n' "$GITHUB_TOKEN" > ~/.netrc && chmod 600 ~/.netrc
      - rm -rf .acki-nacki
      - git clone --depth 1 --branch "$ACKI_BRANCH" "$ACKI_REPO" .acki-nacki
      - rm -f ~/.netrc

  inventory_clone:
    image: *ansible_image
    environment:
      GITHUB_TOKEN: { from_secret: GITHUB_TOKEN }
      INVENTORY_REPO: { from_secret: inventory_repo_url }
      INVENTORY_BRANCH: *inventory_branch
    commands:
      - printf 'machine github.com\nlogin x-access-token\npassword %s\n' "$GITHUB_TOKEN" > ~/.netrc && chmod 600 ~/.netrc
      - rm -rf .inventory
      - git clone --depth 1 --branch "$INVENTORY_BRANCH" "$INVENTORY_REPO" .inventory
      - rm -f ~/.netrc

  remember_ssh_key:
    image: *ansible_image
    environment:
      SSH_NET_KEY: { from_secret: ssh_dodex_ci }
    commands:
      - mkdir -p ~/.ssh
      - echo "$SSH_NET_KEY" | tr '@' '\n' > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
      - cp -ar ~/.ssh ./.ssh

  prepare_host:
    depends_on:
      - acki_clone
      - inventory_clone
      - remember_ssh_key
    image: *ansible_image
    directory: .acki-nacki/ansible
    environment:
      INV: *e2e_inventory
    commands:
      - cp -ar $CI_WORKSPACE/.ssh ~/.ssh
      - ansible-playbook install-rust-python.yaml -i "$CI_WORKSPACE/$INV"
      - ansible-playbook dexdo-e2e-prepare.yml -i "$CI_WORKSPACE/$INV"

  net_up:
    depends_on:
      - prepare_host
    image: *ansible_image
    directory: .acki-nacki/ansible
    environment:
      INV: *e2e_inventory
      ACKI_DIR: *acki_dir_on_host
      SEED_NOTES_WS: *seed_notes_ws
      GITHUB_TOKEN: { from_secret: GITHUB_TOKEN }
      ACKI_REPO: { from_secret: acki_repo_url }
      ACKI_BRANCH: *acki_branch
    commands:
      - cp -ar $CI_WORKSPACE/.ssh ~/.ssh
      - >
        ansible-playbook dexdo-e2e-up.yml
        -i "$CI_WORKSPACE/$INV"
        -e acki_dir="$ACKI_DIR"
        -e seed_notes_dest="$CI_WORKSPACE/$SEED_NOTES_WS"
        -e endpoint_host_dest="$CI_WORKSPACE/acki_net_host"

  deploy_dexdo:
    depends_on:
      - net_up
    image: *ansible_image
    directory: deploy/ansible
    environment:
      INV: *e2e_inventory
      SEED_NOTES_WS: *seed_notes_ws
    commands:
      - cp -ar $CI_WORKSPACE/.ssh ~/.ssh
      - >
        ansible-playbook deploy-dexdo.yml
        -i "$CI_WORKSPACE/$INV"
        -e dexdo_image_tag=$CI_COMMIT_SHA
        -e dexdo_seed_accounts=true
        -e dexdo_seed_notes_src="$CI_WORKSPACE/$SEED_NOTES_WS"

  e2e_tests:
    depends_on:
      - deploy_dexdo
    image: *rust_image
    environment:
      E2E_NETWORK_ENDPOINT: "http://127.0.0.1"
      TEST_DATABASE_URL: { from_secret: e2e_test_database_url }
      E2E_HOST: { from_secret: e2e_host }
      E2E_CI_USER: { from_secret: e2e_ci_user }
      DB_HOST_PORT: *db_host_port
      SEED_NOTES_WS: *seed_notes_ws
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    commands:
      - apt-get update && apt-get install -y --no-install-recommends openssh-client >/dev/null
      - cp -ar $CI_WORKSPACE/.ssh ~/.ssh && chmod 700 ~/.ssh && chmod 600 ~/.ssh/id_ed25519
      - ACKI_NET_HOST="$(cat $CI_WORKSPACE/acki_net_host)"
      - >
        ssh -f -N
        -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ExitOnForwardFailure=yes
        -L 127.0.0.1:80:$ACKI_NET_HOST:80
        -L 127.0.0.1:5432:127.0.0.1:$DB_HOST_PORT
        "$E2E_CI_USER@$E2E_HOST"
      - export E2E_SEED_NOTES="$CI_WORKSPACE/$SEED_NOTES_WS"
      - curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C /usr/local/cargo/bin
      - >
        cargo nextest run --profile ci-e2e -p dodex-api --run-ignored only --test-threads 1 --no-fail-fast
        -E 'not binary(e2e_inference_dispute)
        and not test(=inference_match_emits_filled_event)
        and not test(=inference_partial_fill_leaves_remainder)
        and not test(=inference_offer_matches_buy_and_funds_token_contract)
        and not test(=inference_settlement_immediate_stop_does_not_pay_streaming_tick)
        and not test(=inference_stream_open_advance_stop_against_shellnet)'

  net_down:
    depends_on:
      - e2e_tests
    image: *ansible_image
    directory: .acki-nacki/ansible
    when:
      - status: [ success, failure ]
    environment:
      INV: *e2e_inventory
      ACKI_DIR: *acki_dir_on_host
    commands:
      - cp -ar $CI_WORKSPACE/.ssh ~/.ssh
      - ansible-playbook dexdo-e2e-down.yml -i "$CI_WORKSPACE/$INV" -e acki_dir="$ACKI_DIR" -e full_cleanup=true
