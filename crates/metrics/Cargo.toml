[package]
name = "dodex-metrics"
version = "0.1.0"
edition = "2024"
license = "LicenseRef-Acki-Nacki-Node-License"

# Inline pins (not `.workspace = true`) so this crate can be consumed
# standalone from a separate Cargo workspace or Docker build. Same rationale as
# `crates/logging` and `crates/chain`.
[dependencies]
opentelemetry = { version = "0.27", features = ["metrics"] }
opentelemetry-otlp = { version = "0.27", features = ["metrics"] }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
tracing = "0.1"

# Dev-only: exercise the OTLP export path with an in-memory reader/exporter.
# `opentelemetry_sdk`'s `testing` module (InMemoryMetricExporter et al.) is
# gated on `cfg(any(feature = "testing", test))`, and this crate's production
# feature set (`rt-tokio` only) does not enable it, so the test-only "testing"
# feature is pulled in here rather than as a production feature. Does not
# change the production feature set or dependents' dependency graph.
[dev-dependencies]
opentelemetry_sdk = { version = "0.27", features = ["testing"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
