[package]
name = "dodex-market-manager"
version = "0.1.0"
edition = "2024"
license-file = "../../LICENSE.md"
publish = false

# Standalone crate — deliberately NOT a member of the root dodex-backend
# workspace. Declared as its own workspace root via the empty `[workspace]`
# block below so `cargo` doesn't try to pull it into the parent's resolver
# graph. Rationale: staging-only tool, must never enter the prod build
# pipeline, and we want its own Cargo.lock so dependency churn here cannot
# break api/indexer builds.
[workspace]

[dependencies]
anyhow = "1.0"
num-bigint = "0.4"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.44", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

ackinacki-kit = { git = "https://github.com/gosh-sh/ackinacki-kit.git", branch = "feature/update_dex", default-features = false, features = ["contracts", "default"] }
dodex-chain = { path = "../../crates/chain", features = ["test-helpers"] }
dodex-logging = { path = "../../crates/logging" }
