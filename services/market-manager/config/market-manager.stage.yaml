# Staging-only market manager. Keeps `target_active_markets` live USDC
# OrderBooks on shellnet by cycling through events.stage.json. Tops up
# the 10 seeder USDC PNs from the default giver. NOT used in prod.

endpoint: shellnet.ackinacki.org

# Markets last days, so reactive polling is unnecessary. 60s tick =
# new markets land within a minute of dropping below target; refill
# checks all PNs every minute (cheap, idempotent).
tick_interval_secs: 60

target_active_markets: 1

# Per-market lifetime is a random integer in [min..=max] hours. Bidding
# window = lifetime / 10 (contract-fixed) — at 24..=72 the bidding
# window is 2.4..=7.2h, after which splitFullSet runs and the market
# stays Active until `result_end`.
lifetime_hours_min: 24
lifetime_hours_max: 72

# JSON state — picks up where we left off across restarts. Mounted as a
# named volume in docker-compose.yml.
state_file: /state/markets.json

# Sibling files inside the image's config/ dir.
events_file: /app/config/events.stage.json
secrets_file: /app/config/market-manager.secrets.json

# On-chain market parameters. token_type MUST match the PNs' token_type
# (we got 10 USDC PNs — token_type=3). If we ever switch to a NACKL PN
# pool, change token_type to 1 and rescale all amounts by 1000× (NACKL
# raw base is 1e9, USDC raw base is 1e6).
market:
  # ECC currency id: 1=NACKL, 2=SHELL, 3=USDC.
  token_type: 3
  # Per-outcome stake at deployPMP. 1 USDC.
  deployer_seed_amount: 1000000
  # Per-outcome stake during bidding window. 20 USDC.
  regular_stake_amount: 20000000
  # Collateral split into outcome tokens after freeze. 100 USDC.
  split_collateral: 100000000
  # Mirror bee-engine constants — these don't scale with token decimals.
  oracle_fee: 100
  oracle_fee_deadline: 2000000000
  # Per-market USDC burn = 2×seed + 2×regular + split = 142 USDC.
  # With nominal=N1000 per PN, one PN supports ~7 markets before drain.

# Refill thresholds. Units = raw token base. PNs arrived `shell_funded`
# and `native_funded`, but they'll drain over time — keep them topped.
# NACKL is not used by this pool (zeroed so the refill step skips it).
topup:
  native_min:    10000000000   #  10 vmshell
  native_topup:  50000000000   #  50 vmshell
  nackl_min:               0   # PNs are USDC, NACKL refill disabled
  nackl_topup:             0
  shell_min:     20000000000   #  20 SHELL
  shell_topup: 100000000000    # 100 SHELL
  usdc_min:        300000000   # 300 USDC (safe margin over 142/market burn)
  usdc_topup:     2000000000   #  2k USDC (covers ~14 markets per refill)

# Background "noise" so order books don't sit empty. Per tick we roll a
# die against `stake_probability_per_tick`; on a hit, one random PN
# stakes `stake_amount` raw USDC on a random outcome of a random
# in-bidding market. No order-book trading here — MM is a separate
# service.
traders:
  stake_probability_per_tick: 0.3
  stake_amount: 5000000   # 5 USDC
