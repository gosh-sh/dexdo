[package]
name = "dodex-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
num-bigint.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
salvo.workspace = true
salvo-oapi.workspace = true
salvo_extra.workspace = true
uuid.workspace = true
dodex-application = { path = "../../crates/application" }
dodex-domain = { path = "../../crates/domain" }
dodex-infrastructure = { path = "../../crates/infrastructure" }

[dev-dependencies]
ackinacki-kit.workspace = true
async-trait.workspace = true
bee-dex.workspace = true
hex = "0.4"
hmac = "0.12"
num-bigint.workspace = true
sha2 = "0.10"
sqlx.workspace = true
