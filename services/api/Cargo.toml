[package]
name = "dodex-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
num-bigint.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
salvo.workspace = true
salvo-oapi.workspace = true
salvo_extra.workspace = true
uuid.workspace = true
dodex-application = { path = "../../crates/application" }
dodex-domain = { path = "../../crates/domain" }
dodex-infrastructure = { path = "../../crates/infrastructure" }
dodex-logging = { path = "../../crates/logging" }

[dev-dependencies]
ackinacki-kit.workspace = true
dodex-contracts.workspace = true
async-trait.workspace = true
# e2e tests deploy an ephemeral PMP + OrderBook before exercising the
# trader path; that needs `test-helpers` to expose deploy methods on
# `dodex_chain::Dex`. The prod api binary depends on dodex-chain
# transitively through dodex-infrastructure without the feature.
dodex-chain = { workspace = true, features = ["test-helpers"] }
hex = "0.4"
hmac = "0.12"
num-bigint.workspace = true
sha2 = "0.10"
sqlx.workspace = true
dotenvy.workspace = true
# Salvo's in-process `TestClient` lives behind the `test` feature. We
# keep it out of the production build (only `logging` in workspace deps)
# so the helper code is never shipped.
salvo = { workspace = true, features = ["test"] }
