[workspace]
members = [
    "services/api",
    "services/indexer",
    "crates/chain",
    "crates/domain",
    "crates/application",
    "crates/infrastructure",
    "crates/logging",
    "crates/metrics",
]
# `sdk/` is its own workspace, kept out of the root resolve on purpose: its
# halo2 proof pipeline pulls a heavy, distinct zk/halo2 dependency graph.
# Build it directly from `sdk/`; all its git sources are public over HTTPS.
exclude = ["sdk"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "LicenseRef-Acki-Nacki-Node-License"
license-file = "LICENSE.md"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls", "macros", "migrate", "json", "uuid"] }
thiserror = "2.0"
tokio = { version = "1.44", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
salvo = { version = "0.74", features = ["logging"] }
salvo-oapi = { version = "0.74", features = ["yaml"] }
salvo_extra = "0.74"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
base64 = "0.22"
num-bigint = "0.4"
zeroize = { version = "1.8", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
dotenvy = "0.15"
tvm_abi = { git = "https://github.com/tvmlabs/tvm-sdk.git", tag = 'v3.0.0.an' }
tvm_block = { git = "https://github.com/tvmlabs/tvm-sdk.git", tag = 'v3.0.0.an' }
tvm_executor = { git = "https://github.com/tvmlabs/tvm-sdk.git", tag = 'v3.0.0.an' }
tvm_types = { git = "https://github.com/tvmlabs/tvm-sdk.git", tag = 'v3.0.0.an' }
tvm_vm = { git = "https://github.com/tvmlabs/tvm-sdk.git", tag = 'v3.0.0.an' }
# Public chain primitives (PrivateNote, OrderBook, Pmp, RootPn, tvm_client).
# The write-side facade that wraps these lives in `crates/chain/`; the
# API (trader path) and the e2e tests reach for it via the `dodex-chain`
# workspace dep. Kept in-tree because the upstream facade `bee-dex` ships
# from a private SSH-only repo and staging / CI hosts have no key for it.
ackinacki-kit = { git = "https://github.com/gosh-sh/ackinacki-kit.git", tag = "v2.0.0", default-features = false, features = ["contracts", "default"] }
dodex-chain = { path = "crates/chain" }
