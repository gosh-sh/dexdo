[workspace]
members = [
    "services/api",
    "services/indexer",
    "crates/chain",
    "crates/contracts",
    "crates/domain",
    "crates/application",
    "crates/infrastructure",
    "crates/logging",
    "crates/metrics",
]
# `sdk/` is its own workspace, kept out of the root resolve on purpose: its
# halo2 proof pipeline pulls a heavy, distinct zk/halo2 dependency graph.
# Build it directly from `sdk/`; all its git sources are public over HTTPS.
exclude = ["sdk"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "LicenseRef-Acki-Nacki-Node-License"
license-file = "LICENSE.md"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls", "macros", "migrate", "json", "uuid", "chrono"] }
thiserror = "2.0"
tokio = { version = "1.44", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
salvo = { version = "0.74", features = ["logging"] }
salvo-oapi = { version = "0.74", features = ["yaml"] }
salvo_extra = "0.74"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
base64 = "0.22"
num-bigint = "0.4"
zeroize = { version = "1.8", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
dotenvy = "0.15"
chrono = { version = "0.4", features = ["clock"] }
tvm_abi = { git = "https://github.com/tvmlabs/tvm-sdk.git", tag = 'v3.0.4.an' }
tvm_block = { git = "https://github.com/tvmlabs/tvm-sdk.git", tag = 'v3.0.4.an' }
tvm_executor = { git = "https://github.com/tvmlabs/tvm-sdk.git", tag = 'v3.0.4.an' }
tvm_types = { git = "https://github.com/tvmlabs/tvm-sdk.git", tag = 'v3.0.4.an' }
tvm_vm = { git = "https://github.com/tvmlabs/tvm-sdk.git", tag = 'v3.0.4.an' }
# `ackinacki-kit` supplies the contract-wrapper trait surface (ContractBase,
# encode/decode/send/getter traits) plus the error/account/event/deserialize
# infra and `tvm_client`. The DEX contract wrappers themselves (PrivateNote,
# OrderBook, Pmp, RootPn, …) live in-repo in `dodex-contracts`, built on those
# traits. `dodex-chain` is the write-side facade wrapping them; the API
# (trader path) and e2e tests reach for it via the `dodex-chain` dep. The
# facade is kept in-tree because the upstream `bee-dex` ships from a private
# SSH-only repo and staging / CI hosts have no key for it.
ackinacki-kit = { git = "https://github.com/gosh-sh/ackinacki-kit.git", tag = "v3.0.0", default-features = false, features = ["contracts", "default"] }
dodex-chain = { path = "crates/chain" }
dodex-contracts = { path = "crates/contracts" }

# `tvm_vm` pulls in the axiom-crypto zk stack (axiom-eth → halo2-lib →
# snark-verifier), which upstream only builds on nightly: halo2-base drags in
# crates.io `poseidon-primitives`, whose 0.1.1 is gated on
# `#![feature(slice_group_by)]`, and axiom-eth / snark-verifier-sdk need
# `#![feature(trait_alias)]`. The gosh-sh forks below strip those nightly gates.
#
# tvm-sdk carries an identical [patch] block in its own workspace root, but
# cargo only honours [patch] from the root manifest of the crate being built —
# it is never inherited through a dependency edge. So the block has to be
# repeated verbatim here or the workspace resolves the unpatched upstream and
# fails with E0554 on stable. Keep it in sync when bumping the tvm-sdk tag.
[patch.crates-io]
halo2-base = { git = "https://github.com/gosh-sh/halo2-lib-zkevm-sha256-and-bls12-381", branch = "bump-halo2-lib-v0.4.1" }
halo2-axiom = { git = "https://github.com/gosh-sh/halo2-axiom", branch = "main" }

# axiom-eth + snark-verifier-sdk pull halo2-base / halo2-ecc / zkevm-hashes from here.
[patch."https://github.com/axiom-crypto/halo2-lib.git"]
halo2-base = { git = "https://github.com/gosh-sh/halo2-lib-zkevm-sha256-and-bls12-381", branch = "bump-halo2-lib-v0.4.1" }
halo2-ecc = { git = "https://github.com/gosh-sh/halo2-lib-zkevm-sha256-and-bls12-381", branch = "bump-halo2-lib-v0.4.1" }
zkevm-hashes = { git = "https://github.com/gosh-sh/halo2-lib-zkevm-sha256-and-bls12-381", branch = "bump-halo2-lib-v0.4.1" }

# The gosh-sh axiom-eth branch also redirects snark-verifier{-sdk} to the
# stable-Rust gosh fork, so those need no [patch] entry of their own.
[patch."https://github.com/axiom-crypto/axiom-eth"]
axiom-eth = { git = "https://github.com/gosh-sh/axiom-eth", branch = "gosh-stable-rlcmanager-assignment" }
