---
# Defaults for the dexdo role. These are the lowest-precedence layer, so any
# value can be overridden per environment in that env's inventory
# (inventories/<env>/hosts.yml → group `dexdo` vars). Secrets live in the env's
# own vault (inventories/<env>/group_vars/all/vault.yml).

# --- Environment ------------------------------------------------------------
# Environment name. Drives the rendered config file names (api.<env>.yaml /
# indexer.<env>.yaml), the app.env field, and APP_CONFIG in the compose file.
# SET THIS PER ENVIRONMENT IN THE INVENTORY — this default is only a fallback.
dexdo_env: stage

# --- Image source (images are PULLED, built by .woodpecker/build.yml) -------
# Nothing is built on the host. The registry holds <registry>/dexdo-api and
# <registry>/dexdo-indexer; the host must be authenticated to pull from it.
dexdo_registry: docker.gosh.sh
# Image tag to deploy. CI passes the commit SHA via `-e dexdo_image_tag=...`;
# the default is only used for manual runs.
dexdo_image_tag: latest-dev

# --- Host layout ------------------------------------------------------------
dexdo_deploy_dir: /opt/dexdo
# Where the services write their log files. Defaults under the deploy dir; break
# it out to its own disk/mount per environment when you want logs off the system
# disk or surviving a redeploy. Per-service subdirs `<dir>/api` and
# `<dir>/indexer` are bind-mounted to /app/logs.
dexdo_logs_dir: "{{ dexdo_deploy_dir }}/logs"
# Run api + indexer with the host's network stack (network_mode: host) instead
# of the compose bridge. Off by default. Turn on ONLY when the chain must be
# reached over the host's 127.0.0.1 — e2e, where a co-located single-compose
# acki-nacki network fronts on 127.0.0.1:80 and there is no private interface to
# bind on. Then set dexdo_chain_gateway_endpoint / dexdo_graphql_endpoint to
# http://127.0.0.1 and dexdo_db_host to 127.0.0.1 (postgres reached via its
# published 127.0.0.1:dexdo_db_publish_port). The api port publish is dropped
# (host net ignores port maps — the api listens on dexdo_api_port directly).
dexdo_host_network: false

# --- Acki Nacki endpoints (see docs/deployment.md Step 1) -------------------
dexdo_graphql_endpoint: https://shellnet.ackinacki.org/graphql
dexdo_chain_gateway_endpoint: shellnet.ackinacki.org

# --- App knobs --------------------------------------------------------------
dexdo_log_level: info
dexdo_rust_log: info
# API port — drives the host-published port, the in-container listen port, and
# server.port (all from this one var). Override per environment in the inventory
# when 8080 is already taken on the host (multiple services share it).
dexdo_api_port: 8080
# Seeding writes DB rows for pre-deployed PrivateNotes; off by default.
# See docs/seed-private-notes.md before turning on. When true, the api seeds one
# account + api_key per note in the seed-notes file on first start (e2e uses this
# to create the trading users whose PNs the zerostate deployed).
dexdo_seed_accounts: false
# Source seed-notes JSON to install as config/seed_notes_list.json when seeding is
# on. seed_notes format: a JSON array of {pn_address, pn_pubkey_hex, pn_seckey_hex,
# pn_dih_hex} (ignored tokenType/value allowed). Path on the Ansible controller /
# CI workspace (absolute, or relative to the role's files/). Carries plaintext note
# seckeys -> never commit it; provide it out of band (e2e: the zerostate notes).
dexdo_seed_notes_src: ""

# --- Database ---------------------------------------------------------------
# Bundled-Postgres toggle:
#   false (default) -> connect to an EXISTING database; set dexdo_db_host/port/
#                      name/user + vault_dexdo_db_password to point at it.
#   true            -> run a bundled throwaway `postgres` service in the compose
#                      stack (ephemeral tmpfs, tuned like docker-compose.test.yml);
#                      leave dexdo_db_host at `postgres`. Intended for e2e/dev.
dexdo_db_local: false
# Host port to publish the bundled postgres on (for an out-of-compose test runner,
# e.g. the e2e cargo-nextest step). Empty -> not published (internal only).
dexdo_db_publish_port: ""
# Optional IP to bind the published port to (empty -> all interfaces).
dexdo_db_bind_ip: ""

dexdo_db_user: dodex
dexdo_db_name: dodex
# When dexdo_db_local=true this must stay `postgres` (the compose service name).
# When false, override it with the external DB host in the env inventory.
dexdo_db_host: postgres
# Internal compose-network port when local; the external DB's port when not.
dexdo_db_port: 5432
# Password is a secret -> the env vault (vault_dexdo_db_password).
dexdo_db_password: "{{ vault_dexdo_db_password }}"
# Connection string shared by api + indexer. The password is URL-encoded so
# special characters are safe inside the URL; the postgres service env gets the
# raw value.
dexdo_database_url: "postgresql://{{ dexdo_db_user }}:{{ dexdo_db_password | urlencode }}@{{ dexdo_db_host }}:{{ dexdo_db_port }}/{{ dexdo_db_name }}"

# --- OpenTelemetry / OTLP metrics (indexer) ---------------------------------
# Endpoint of your OTLP collector (gRPC). Empty -> the indexer collects no
# metrics (empty counts as unset). Set per environment in the inventory.
dexdo_otel_endpoint: ""
dexdo_otel_metrics_protocol: grpc
dexdo_otel_service_name: dodex-indexer-test

# --- Logging & rotation -----------------------------------------------------
# The api + indexer already write per-service, daily-rotated files under
# `dexdo_logs_dir/<service>` (bind-mounted to /app/logs) via the dodex-logging
# crate: <service>.log.<date> (+ .noise.log), pruned to LOG_MAX_FILES days — so
# rotation is already handled and the logrotate sidecar below is OFF by default.
# Optional logrotate sidecar: a tiny container that adds a SIZE cap on top of the
# app's daily rotation (rotate by size, copytruncate since the services keep the
# files open). Turn on per env only if you also need a size ceiling.
dexdo_logrotate_enabled: false
# Image providing `logrotate` + busybox `crond` + bash.
dexdo_logrotate_image: docker.gosh.sh/logrotate:3.13.0
# Rotate a log file once it reaches this size; keep this many rotated copies.
dexdo_log_rotate_size: 2G
dexdo_log_rotate_amount: 10
# BusyBox crontab "minute hour" fields for the rotation run (the remaining
# day/month/weekday fields are wildcarded). "*/5 *" -> every 5 minutes, so a
# fast-growing log can't overshoot the size cap by much between checks.
dexdo_log_rotate_spec: "*/5 *"

# --- Secrets (resolved from the env vault) ----------------------------------
dexdo_kek_hex: "{{ vault_dexdo_kek_hex }}"
