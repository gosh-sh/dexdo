# Per-environment inventory. Copy this whole directory to inventories/<env>/
# (e.g. inventories/stage/), then drop the env's secrets in
# inventories/<env>/group_vars/all/vault.yml (see ../vault.example.yml).
#
# The environment NAME is `dexdo_env`; it drives the rendered config file names
# (api.<env>.yaml / indexer.<env>.yaml), the app.env field, and APP_CONFIG.
all:
  children:
    dexdo:
      vars:
        dexdo_env: stage
        dexdo_deploy_dir: /opt/dodex-stage
        # Database: default is to connect to an existing DB. To run a bundled
        # Postgres in the compose stack instead, flip the flag (and leave
        # dexdo_db_host at `postgres`):
        # dexdo_db_local: true
        # For an external DB (dexdo_db_local stays false), point it at the host:
        # dexdo_db_host: db.example.org
        # dexdo_db_port: 5432
        # dexdo_db_name: dodex
        # dexdo_db_user: dodex
        #
        # Metrics: point the indexer at your OTLP collector (gRPC) to enable
        # them; empty/unset = no metrics.
        # dexdo_otel_endpoint: http://otel-collector:4317
        #
        # Per-environment overrides (optional) — any role default can be set
        # here to diverge from roles/dexdo/defaults/main.yml, e.g.:
        # dexdo_api_port: 8081          # set if 8080 (the default) is taken on the host
        # dexdo_image_tag: latest-dev
        # dexdo_graphql_endpoint: https://stage.example.org/graphql
        # dexdo_chain_gateway_endpoint: stage.example.org
        # dexdo_log_level: debug
      hosts:
        dexdo-stage-1:
          ansible_host: 203.0.113.10   # your server IP / DNS name
          ansible_user: deploy         # SSH user the ssh_private_key is authorised for
