app:
  env: local
  log_level: info

database:
  # Local Postgres convention, matching `config/api.local.yaml`. Override
  # `APP_CONFIG` (or this URL in your own untracked copy) to point at a
  # remote pooler — do NOT commit live credentials back into this file.
  url: postgres://postgres:postgres@localhost:5432/dodex
  max_connections: 10
  min_connections: 1
  connect_timeout_ms: 3000

graphql:
  endpoint: https://shellnet.ackinacki.org/graphql
  # bearer_token: "<gateway-token>" # only for protected GraphQL endpoints
  page_size: 100
  request_timeout_ms: 10000

indexer:
  polling_interval_ms: 3000
  depth_refresh_interval_ms: 5000
  reconciliation_interval_ms: 60000
  reprojection_batch_size: 500
  # Cadence for the OracleEventList reconciler that fills oracle_events.describe
  # (and trust_addr) by calling OEL._events getter — `EventAdded` does not
  # carry these fields, they live only in contract state.
  oracle_event_list_reconciliation_interval_ms: 60000
  # Source addresses whose events are dropped before raw_events insert and
  # projector dispatch. Keep this list narrow — only addresses that emit
  # confirmed noise.
  ignored_addresses:
    - "0:1111111111111111111111111111111111111111111111111111111111111111"
  # Event types dropped before decode, matched by their external dst (no decode
  # cost). The cursor still advances past them. List ONLY genuine no-op types
  # (the projector maps them to Applied without touching the read model):
  # OrderBook.Queued / FullyFilled / Rejected / CallbackBounced. The startup
  # guard is an allow-list and rejects everything else — metric-critical types
  # (OrderBook.OrderPlaced, OrderBook.PartialFill), state-changing types, and
  # typos — so a bad entry fails startup rather than dropping events silently.
  ignored_event_types:
    - "OrderBook.Queued"
    - "PMP.StakeAccepted"
    - "PMP.MergeProcessed"
  # Inference reconciler/sweep/orphan-cutoff knobs.
  inference_reconciliation_interval_ms: 15000
  inference_reference_price_refresh_ms: 3600000
  inference_sweep_interval_ms: 30000
  inference_orphan_cutoff_ms: 1800000
