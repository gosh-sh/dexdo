app:
  env: local
  log_level: info

server:
  host: 0.0.0.0
  port: 8080
  request_timeout_ms: 5000

database:
  url: postgres://postgres:postgres@localhost:5432/dodex
  max_connections: 10
  min_connections: 1
  connect_timeout_ms: 3000

auth:
  # Local-dev KEK shared via this file; stage/prod configs ship their own.
  kek_hex: "00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff"
  default_recv_window_ms: 5000
  max_recv_window_ms: 60000
  seed_accounts: true
