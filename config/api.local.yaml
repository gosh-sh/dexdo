app:
  env: local
  log_level: info

server:
  host: 0.0.0.0
  port: 8080
  # Enforced by the request_timeout hoop in services/api. Must exceed
  # every chain timeout (place_order, cancel_order, place_batch) by a safety margin —
  # cutting off the HTTP request while the chain call is still in flight
  # would land the operation on chain while returning 504 to the client,
  # who would then not know its id (the worst failure mode for
  # optimistic submission). 35 s = 30 s chain + ~5 s slack covers it.
  request_timeout_ms: 35000

database:
  url: postgres://postgres:postgres@localhost:5432/dodex
  max_connections: 10
  min_connections: 1
  connect_timeout_ms: 3000

auth:
  # Local-dev KEK shared via this file; stage/prod configs ship their own.
  kek_hex: "00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff"
  default_recv_window_ms: 5000
  max_recv_window_ms: 60000
  seed_accounts: true

chain:
  # Acki Nacki gateway the trading path POSTs external messages to.
  # Stage/prod configs ship their own endpoints.
  gateway_endpoint: shellnet.ackinacki.org
  place_order_timeout_ms: 30000
  cancel_order_timeout_ms: 30000
  place_batch_timeout_ms: 30000

graphql:
  # On-demand PN BOC reads for /api/v1/account and /account/balances.
  # Points at the same gateway URL the indexer uses (see
  # config/indexer.local.yaml). Production may diverge.
  endpoint: https://shellnet.ackinacki.org/graphql
  request_timeout_ms: 10000
